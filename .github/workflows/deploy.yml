# CI on GitHub, CD on the NAS.
#   every push / PR  -> build the image (proves it builds)
#   push to main     -> also publish to ghcr.io, then send a signed "new version" notice to
#                       https://hooks.rascaltwo.com, which makes the NAS pull + redeploy.
# GitHub never gets access to the home network: the notice only raises a flag; the NAS
# decides what to do and only ever pulls this repo's own image.
name: build & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/rascaltwo/rascaltwo.com

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-nas:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Signed deploy notice
        env:
          SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          body=$(printf '{"app":"site","image":"%s","digest":"%s","sha":"%s","ts":%s}' \
            "$IMAGE" "$DIGEST" "$GITHUB_SHA" "$(date +%s)")
          sig="sha256=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$SECRET" -r | cut -d' ' -f1)"
          curl -fsS --max-time 20 -X POST https://hooks.rascaltwo.com/deploy \
            -H "Content-Type: application/json" \
            -H "X-Signature-256: $sig" \
            --data "$body"
