<!doctype html>
<!-- Shown by the front door (homelab repo: lightsail/fallback-refresh) while this site
     is down. It's copied once a day while the site is up, so it must be fully
     self-contained: no fonts, images or scripts from anywhere else. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Be right back</title>
<style>
  :root {
    --background-color: black; --color: white;
    --section: hsl(200, 40%, 15%); --muted: hsl(200, 10%, 66%);
    --inversion: invert(0);
  }
  body[data-theme="light"] {
    --background-color: white; --color: black;
    --section: hsl(200, 40%, 75%); --muted: hsl(200, 10%, 33%);
    --inversion: invert(1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; padding: 2rem;
    background: radial-gradient(ellipse at 50% 35%, color-mix(in srgb, var(--section) 35%, var(--background-color)), var(--background-color) 70%),
                linear-gradient(to bottom, transparent 60%, var(--section));
    background-color: var(--background-color);
    color: var(--color);
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Oxygen,
      Ubuntu, Cantarell, Fira Sans, Droid Sans, Helvetica Neue, sans-serif;
  }
  main { max-width: 34rem; text-align: center; }
  .badge { position: relative; width: 15rem; height: 15rem; margin: 3rem auto 2rem; display: grid; place-items: center; }
  .ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: .9rem solid hsl(265, 85%, 70%);
    box-shadow: 0 0 2rem hsl(265, 85%, 60%), inset 0 0 2rem hsl(265, 85%, 60%);
    filter: var(--inversion);
    animation: cycle-hues 10s linear infinite;
  }
  /* The header's ring cycles through every hue; same here. */
  @keyframes cycle-hues {
    from { filter: hue-rotate(0deg) var(--inversion); }
    to { filter: hue-rotate(360deg) var(--inversion); }
  }
  @media (prefers-reduced-motion: reduce) { .ring, .name { animation: none; } }
  .name {
    position: absolute; top: -2.6rem; left: -10rem; right: -10rem; white-space: nowrap;
    font-family: ui-monospace, Consolas, 'Courier New', monospace;
    letter-spacing: .4em; font-size: 1.05rem; color: hsl(265, 85%, 75%);
    animation: cycle-hues 10s linear infinite;
  }
  h1 { font-size: 1.5rem; margin: 0; position: relative; }
  p { margin: 0 0 1rem; color: var(--muted); line-height: 1.6; }
  small { display: block; margin-top: 2rem; color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<main>
  <div class="badge"><div class="ring"></div><span class="name" id="name">Rascal Two</span><h1>Be right back</h1></div>
  <p>This site is temporarily offline. Nothing you did caused this, and it's usually back within a few minutes.</p>
  <p>This page checks again on its own every 30&nbsp;seconds.</p>
  <small id="status">Next check in 30 s</small>
</main>
<script>
  // One file for both brands; the name follows the hostname, like the site's i18n routing.
  if (location.hostname.includes('josephmilliken')) document.getElementById('name').textContent = 'Joseph Milliken';
  // Same theme key the site's ThemeToggler writes, so a visitor keeps their choice.
  const saved = localStorage.getItem(location.host + '-selected-theme');
  const theme = saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  if (theme === 'light') document.body.dataset.theme = 'light';

  let left = 30;
  const status = document.getElementById('status');
  setInterval(() => {
    left -= 1;
    if (left <= 0) location.reload();
    else status.textContent = 'Next check in ' + left + ' s';
  }, 1000);
</script>
</body>
</html>
